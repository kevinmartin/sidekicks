version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: npm
    directory: /extensions/sidekicks
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directories:
      - /infrastructure/images/browser-use
      - /infrastructure/images/browser-dev-tools
    schedule:
      interval: weekly
