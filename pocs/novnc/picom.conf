backend = "xrender";
vsync = false;
use-damage = true;
shadow = true;
shadow-radius = 16;
shadow-opacity = 0.18;
shadow-offset-x = 0;
shadow-offset-y = 7;
shadow-exclude = ["window_type = 'dock'", "window_type = 'desktop'"];
fading = false;
detect-client-opacity = true;
detect-rounded-corners = true;
mark-wmwin-focused = true;
mark-ovredir-focused = true;
