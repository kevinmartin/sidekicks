// Sidekicks disposable desktop: real new tabs open the local app launcher.
try {
  const { AboutNewTab } = ChromeUtils.importESModule("resource:///modules/AboutNewTab.sys.mjs");
  AboutNewTab.newTabURL = "http://127.0.0.1:7792/home";
} catch (error) {
  // Keep Firefox usable if a future ESR changes the internal module. QA must
  // verify Ctrl+T/+ on the actual installed ESR rather than infer from prefs.
  console.error("Sidekicks new-tab override failed", error);
}
