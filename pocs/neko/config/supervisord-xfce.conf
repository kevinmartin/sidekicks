[supervisord]
nodaemon=true
user=root
environment=DBUS_SESSION_BUS_ADDRESS="unix:path=/tmp/sidekicks-session-bus",XDG_CURRENT_DESKTOP="XFCE",DESKTOP_SESSION="xfce",XDG_SESSION_TYPE="x11",LANG="C.UTF-8",LC_ALL="C.UTF-8"
logfile=/var/log/neko/supervisor.log
pidfile=/tmp/sidekicks-supervisor.pid

[program:xorg]
command=/usr/lib/xorg/Xorg :99 -config /etc/sidekicks/xorg.conf -noreset -nolisten tcp
user=neko
priority=10
autorestart=true
stdout_logfile=/var/log/neko/xorg.log
redirect_stderr=true

[program:pulse]
command=/usr/bin/pulseaudio -nF /etc/sidekicks/default.pa --exit-idle-time=-1 --disallow-exit
user=neko
priority=10
autorestart=true
stdout_logfile=/var/log/neko/pulse.log
redirect_stderr=true

[program:session-bus]
command=/etc/sidekicks/session-bus.sh
user=neko
priority=15
autorestart=true
stdout_logfile=/var/log/neko/session-bus.log
redirect_stderr=true

[program:desktop]
command=/etc/sidekicks/desktop-xfce.sh
user=neko
priority=20
autorestart=true
stdout_logfile=/var/log/neko/desktop.log
redirect_stderr=true

[program:neko]
command=/usr/bin/neko serve
user=neko
priority=30
autorestart=true
stdout_logfile=/var/log/neko/neko.log
redirect_stderr=true

[program:adapter]
command=node /app/server.mjs
user=neko
priority=40
autorestart=true
stdout_logfile=/var/log/neko/adapter.log
redirect_stderr=true
