backend = "xrender";
vsync = false;
shadow = true;
shadow-radius = 18;
shadow-opacity = 0.18;
shadow-offset-x = 0;
shadow-offset-y = 8;
shadow-exclude = [ "window_type = 'dock'", "window_type = 'desktop'", "name = 'Sidekicks Dock'" ];
fading = false;
detect-client-opacity = true;
unredir-if-possible = false;
