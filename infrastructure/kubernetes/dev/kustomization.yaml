apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: sidekicks-dev
resources:
  - namespace.yaml
  - deployment.yaml
  - services.yaml
images:
  - name: sidekicks-browser-use
    newTag: latest
  - name: sidekicks-browser-dev-tools
    newTag: latest
secretGenerator:
  - name: sidekicks-dev-config
    files:
      - gateway-token
      - tls.crt
      - tls.key
      - fixture-spki
