// Sidekicks disposable guest: new tabs open the fixed guest-local Home.
try {
  const { AboutNewTab } = ChromeUtils.importESModule("resource:///modules/AboutNewTab.sys.mjs");
  AboutNewTab.newTabURL = "http://127.0.0.1:8081/home";
} catch (error) {
  // A future Firefox ESR change is a verification failure, not a claimed Home.
  console.error("Sidekicks new-tab override failed", error);
  throw error;
}
